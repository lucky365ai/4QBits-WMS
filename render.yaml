services:
  - type: web
    name: wms-backend
    rootDir: backend
    env: node
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: wms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://wms-frontend.onrender.com
      - key: CORS_ORIGIN
        value: https://wms-frontend.onrender.com
      - key: BCRYPT_ROUNDS
        value: 12
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: EMAIL_ENABLED
        value: false
    autoDeploy: false
    plan: free

  - type: web
    name: wms-frontend
    rootDir: frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://wms-backend-es5g.onrender.com
    autoDeploy: false
    plan: free

databases:
  - name: wms-db
    databaseName: wms
    user: wms_user
    plan: free
